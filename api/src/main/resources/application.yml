spring:
  mvc:
    pathMatch:
      matching-strategy: ant_path_matcher
  profiles:
    active: dev
  cache:
    type: caffeine
    caffeine:
      spec: maximumSize=100,expireAfterWrite=1d


springdoc:
  override-with-generic-response: false

app:
  file:
    upload-dir: c:/SuiviTech/uploads
    company-file: c:/SuiviTech/myCompany


jwt:
  secret: ${secret_key}


